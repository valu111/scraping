<spline-viewer url="https://prod.spline.design/At1PTBHZf47XljIR/scene.splinecode"></spline-viewer> -->

<body class="mundo flex flex-col min-h-screen">

  <div class="imagen-frontal"></div>

  <header class="text-3xl font-bold text-center text-white drop-shadow-lg animated-header">
    <h1 class="text-3xl font-bold text-center">Vacantes disponibles</h1>
  </header>
  <main class="flex-grow px-4 py-6 max-w-7xl mx-auto w-full">
  <div class="flex justify-center mb-6">
    <div class="flex items-center gap-4 max-w-2xl justify-center">
      <input
        type="text"
        id="busqueda"
        placeholder="Buscar..."
        class="border rounded-lg px-4 py-2 transition-transform duration-300 ease-in-out hover:scale-105"
      />

      <button
        onclick="guardarBusqueda()"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl shadow-lg transition duration-300 flex items-center gap-2 transition-transform duration-300 ease-in-out hover:scale-105"
      >
        Siguiente
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
        </svg>
      </button>
    </div>
  </div>

  <div id="error" class="mt-2 text-sm text-red-600 font-medium text-center"></div>
  <div id="cards" class="flex justify-center items-center min-h-[60vh] px-4"></div>
</main>

<footer class="bg-white dark:bg-gray-900">

            <span class="text-2xl font-semibold text-gray-900 dark:text-white">Tailwind</span>
          </div>
          <div class="grid grid-cols-2 gap-8 sm:gap-6 sm:grid-cols-3">
              <div>
                  <h2 class="mb-6 text-sm font-semibold text-gray-900 uppercase dark:text-white">Resources</h2>
                  <ul class="text-gray-500 dark:text-gray-400 font-medium">
                      <li class="mb-4">
                          <a href="https://pptr.dev/" class="hover:underline">puppeteer</a>
                      </li>
                      <li>
                          <a href="https://tailwindcss.com/" class="hover:underline">Tailwind CSS</a>
                      </li>
                  </ul>
              </div>
              <div>
                  <h2 class="mb-6 text-sm font-semibold text-gray-900 uppercase dark:text-white">Follow us</h2>
                  <ul class="text-gray-500 dark:text-gray-400 font-medium">
                      <li class="mb-4">
                          <a href="https://github.com/themesberg/flowbite" class="hover:underline ">Github</a>
                      </li>
                      <li>
                          <a href="https://discord.gg/4eeurUVvTy" class="hover:underline">Discord</a>
                      </li>
                  </ul>
              </div>
              <div>
                  <h2 class="mb-6 text-sm font-semibold text-gray-900 uppercase dark:text-white">Legal</h2>
                  <ul class="text-gray-500 dark:text-gray-400 font-medium">
                      <li class="mb-4">
                          <a href="#" class="hover:underline">Privacy Policy</a>
                      </li>
                      <li>
                          <a href="#" class="hover:underline">Terms &amp; Conditions</a>
                      </li>
                  </ul>
              </div>
          </div>
      </div>
      <hr class="my-6 border-gray-200 sm:mx-auto dark:border-gray-700 lg:my-8" />
      <div class="sm:flex sm:items-center sm:justify-between">
          <span class="text-sm text-gray-500 sm:text-center dark:text-gray-400">
          </span>
          <div class="flex mt-4 sm:justify-center sm:mt-0">
              <a href="#" class="text-gray-500 hover:text-gray-900 dark:hover:text-white">
                  <svg class="w-4 h-4" aria-hidden="" xmlns="" fill="currentColor" viewBox="0 0 8 19">
                        <h1>Datos obtenidos con fines educativos </h1>
                    </svg>
                  <span class="sr-only"></span>
              </a>
          </div>
      </div>
    </div>
</footer>

  <style>
  @property --x {
    syntax: '<percentage>';
    inherits: false;
    initial-value: 50%;
  }
  @property --y {
    syntax: '<percentage>';
    inherits: false;
    initial-value: 50%;
  }
  @property --c1 {
    syntax: '<color>';
    inherits: false;
    initial-value: hsla(217, 100%, 50%, 1);
  }
  @property --c2 {
    syntax: '<color>';
    inherits: false;
    initial-value: hsla(279, 67%, 50%, 1);
  }

  @keyframes header-gradient-animation {
    0% {
      --x: 30%;
      --y: 40%;
      --c1: hsla(217, 100%, 50%, 1);
      --c2: hsla(279, 67%, 50%, 1);
    }
    100% {
      --x: 70%;
      --y: 60%;
      --c1: hsla(217, 100%, 40%, 1);
      --c2: hsla(279, 67%, 40%, 1);
    }
  }

  /* Fondo animado (fondo oscuro con gradientes) */
  .animated-header {
    position: relative; /* importante para z-index */
    background-color: #1a1a1a;
    background-image:
      radial-gradient(circle at var(--x) var(--y), var(--c1), transparent 50%),
      radial-gradient(circle at calc(100% - var(--x)) calc(100% - var(--y)), var(--c2), transparent 50%);
    animation: header-gradient-animation 8s ease-in-out infinite alternate;
    z-index: 0;
  }

  /* Imagen delante del fondo pero detrás del contenido */
  .imagen-frontal {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 400px;  /* ajusta tamaño */
    height: auto;
    pointer-events: none; /* no bloquea clicks */
    background-image: url("../img/mundo.png");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    z-index: 1;
    opacity: 0.8; /* opcional, para que no tape mucho */
  }

  /* Contenido visible por encima */
  header {
    position: relative;
    z-index: 2;
  }

  /* Body full height para que se note el fondo */
  body {
    min-height: 100vh;
    margin: 0;
    background-color: transparent; /* para que el fondo animado se vea */
  }
  </style>
</body>

  <script>
    let jugadores = [];
    const container = document.getElementById("cards");
    const inputBusqueda = document.getElementById("busqueda");
    const errorDiv = document.getElementById("error");

    // REALIZA LA BUSQQUEDA Y LO MUESTRA EN TAREG

    function mostrarTarjetas(lista) {
      container.className = "grid gap-6 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3";
      container.innerHTML = "";

      if (lista.length === 0) {
        container.className = "flex justify-center items-center min-h-[60vh] px-4";
        container.innerHTML = `
          <div class="bg-white p-6 rounded shadow text-center max-w-md">
            <img src="./img/dini.gif" alt="Sin resultados" class="w-32 mx-auto mb-4">
            <h2 class="text-xl font-semibold text-red-500">No se encontraron resultados</h2>
            <p class="mt-2">Intenta con otros términos de búsqueda.</p>
          </div>
        `;
        return;
      }

      lista.forEach(j => {
        const imagen = j.imagen || "imagen_por_defecto.jpg";
        const titulo = j.titulo || "Título no disponible";
        const subtitulo = j.subtitulo || "Subtítulo no disponible";
        const texto = j.texto || "Descripción no disponible";
        const ubicacion = j.ubicacion || "Ubicación no disponible";
        const estadoEmpleo = j.estadoEmpleo || "Estado no disponible";
        const enlace = j.enlace || "#";

        container.innerHTML += `
          <div class="bg-white rounded-lg shadow-md p-5 hover:shadow-xl transition duration-300">
            <img src="${imagen}" alt="Imagen del empleo" class="w-full h-40 object-cover rounded mb-4">
            <h2 class="text-lg font-bold text-indigo-700 mb-1">${titulo}</h2>
            <h3 class="text-md text-indigo-500 mb-2">${subtitulo}</h3>
            <p class="text-sm mb-2"><strong>Descripción:</strong> ${texto}</p>
            <p class="text-sm mb-1"><strong>Ubicación:</strong> ${ubicacion}</p>
            <p class="text-sm mb-3"><strong>Estado:</strong> ${estadoEmpleo}</p>
            <a href="${enlace}" target="_blank" class="inline-block mt-2 px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 transition">Ver más</a>
          </div>
        `;
      });
    }

    function mostrarTarjetaError(mensaje) {
      container.className = "flex justify-center items-center min-h-[60vh] px-4";
      container.innerHTML = `
        <div class="bg-gray p-6 rounded shadow text-center max-w-md">
          <img src="potaxie.jpg" alt="Error de búsqueda" class="w-32 mx-auto mb-4">
          <h2 class="text-xl font-semibold text-red-600">Búsqueda inválida</h2>
          <p class="mt-2">${mensaje}</p>
        </div>
      `;
    }

    fetch('empleos.json')
      .then(res => res.json())
      .then(data => {
        jugadores = data;
        container.innerHTML = "";
      })
      .catch(err => {
        container.innerHTML = "<p class='text-red-500'>Error al cargar los datos.</p>";
      });

    function validarTexto(texto) {
      const regex = /^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+$/;
      return regex.test(texto);
    }

    inputBusqueda.addEventListener("keypress", (e) => {
      const char = e.key;
      const regex = /^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]$/;
      if (!regex.test(char)) {
        e.preventDefault();
      }
    });

    inputBusqueda.addEventListener("input", () => {
      const textoBusqueda = inputBusqueda.value;

      if (textoBusqueda === "") {
        errorDiv.textContent = "";
        container.innerHTML = "";
        container.className = "flex justify-center items-center min-h-[60vh] px-4";
        return;
      }

      if (!validarTexto(textoBusqueda)) {
        errorDiv.innerHTML = `Solo se permiten letras, sin espacios, números ni caracteres especiales.`;
        mostrarTarjetaError("No se permiten caracteres especiales, espacios o números. Por favor, ingresa solo letras.");
        return;
      } else {
        errorDiv.textContent = "";
      }

      const textoBusquedaLower = textoBusqueda.toLowerCase();

      const filtrados = jugadores.filter(j => {
        return (
          (j.titulo && j.titulo.toLowerCase().includes(textoBusquedaLower)) ||
          (j.subtitulo && j.subtitulo.toLowerCase().includes(textoBusquedaLower)) ||
          (j.texto && j.texto.toLowerCase().includes(textoBusquedaLower)) ||
          (j.ubicacion && j.ubicacion.toLowerCase().includes(textoBusquedaLower)) ||
          (j.estadoEmpleo && j.estadoEmpleo.toLowerCase().includes(textoBusquedaLower))
        );
      });

      mostrarTarjetas(filtrados);
    });

    function guardarBusqueda() {
  const texto = document.getElementById("busqueda").value.trim();
  
  if (!texto) {
    // Mostrar mensaje de error si no hay texto de búsqueda
    const errorDiv = document.getElementById("error");
    errorDiv.textContent = "Por favor ingresa un término de búsqueda";
    errorDiv.className = "mt-2 text-sm text-red-600 font-medium text-center animate-pulse";
    
    // Mostrar estado vacío
    mostrarTarjetas([]);
    return;
  }
  
  localStorage.setItem("terminoBusqueda", texto);
  window.location.href = 'index2.html';
}
  </script>
  
</body>
</html>
